[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-stuff"
version = "0.1.0"
description = "Analysis behind a blog post on funding a Rotherhithe–Canary Wharf walking and cycling tunnel through land readjustment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.4",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "openpyxl>=3.1.5",
    "osmnx>=2.1.1",
    "pyogrio>=0.13.0",
    "pyproj>=3.7.2",
    "requests>=2.34.2",
    "shapely>=2.1.2",
    "statsmodels>=0.15.0",
]

[tool.setuptools.packages.find]
include = ["tunnel"]

[tool.nbdev]
lib_path = "tunnel"
nbs_path = "nbs"
put_version_in_init = false
jupyter_hooks = false

[tool.ty.environment]
python = ".venv"

[tool.ruff]
line-length = 119
extend-include = ["*.ipynb"]
# Generated from the notebooks by nbdev-export
extend-exclude = ["tunnel"]

[dependency-groups]
dev = [
    "jupytext>=1.19.5",
    "nbdev>=3.3.25",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]
